# Compact LoRA kernel performance suite used by CI.
#
# This is the suite that tests/python/sgl_kernel_npu/test_lora_kernels_perf.py
# runs.  It keeps the shapes that catch a regression in every operator while
# staying inside the CI time budget.
#
# The bounds below are the regression contract: they are generous on purpose
# and only fail when a kernel became orders of magnitude slower (or stopped
# making progress).  Edit them here, not through environment variables.
name: lora-perf-ci
description: Compact LoRA kernel suite for CI (decode + prefill, float16)

defaults:
  dtype: float16
  hidden: 4096
  num_loras: 8
  ranks: [16]
  slice_widths: [4096]
  index_mode: random
  seed: 20260620
  baseline: true
  check: true
  group: default
  timing:
    warmup: 5
    iters: 20
    repeat: 3

scenarios:
  # A decode shape and a prefill shape.  Both run for every operator.
  - name: decode-b64
    tokens: 64
    seq_len: 1

  - name: prefill-t2048
    tokens: 2048
    seq_len: 128

  # QKV-style fused slices, exercised by the grouped operators only.
  - name: qkv-prefill-t2048
    tokens: 2048
    seq_len: 128
    slice_widths: [1024, 1024, 1024]
    group: fused-slices
    ops: [sgemmv_shrink, sgemmv_expand, sgemmc_shrink, sgemmc_expand]

  # Adapters with different ranks, exercised by the grouped operators only.
  # The fixed-rank operators (sgmv/bgmv) share one rank across adapters.
  - name: mixed-rank-prefill-t2048
    tokens: 2048
    seq_len: 128
    ranks: [8, 16, 32, 64]
    group: mixed-ranks
    ops: [sgemmv_shrink, sgemmv_expand, sgemmc_shrink, sgemmc_expand]

bounds:
  # Hard upper bound per iteration, in milliseconds.
  max_latency_ms: 100.0
  # Maximum kernel latency / torch baseline latency ratio.
  max_slowdown: 50.0
  # Fail the test on a numerical mismatch instead of warning.
  strict_check: false
